[package]
name = "mcu_planner"
version = "0.1.0"
edition = "2021"
description = "Road to Doomsday: MCU watch planner, compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "Node", "NodeList", "Event", "EventTarget", "KeyboardEvent",
  "DomRect", "DomTokenList", "Storage", "MediaQueryList",
  "ScrollToOptions", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
  "Selection", "FontFaceSet", "ResizeObserver",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
